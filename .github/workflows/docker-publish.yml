name: Build and Publish Docker Image

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      # --- KODE PENDETEKSI ERROR MULAI ---
      - name: Debug Secrets
        run: |
          echo "Mengecek ketersediaan secrets..."
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "::error::DOCKER_USERNAME KOSONG! Rahasia ini tidak ditemukan atau tidak terbaca."
            exit 1
          else
            echo "✅ DOCKER_USERNAME TERDETEKSI."
          fi
          
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "::error::DOCKER_PASSWORD KOSONG! Rahasia ini tidak ditemukan atau tidak terbaca."
            exit 1
          else
            echo "✅ DOCKER_PASSWORD TERDETEKSI."
          fi
      # --- KODE PENDETEKSI ERROR SELESAI ---

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: aksaex/garuda-sentinel:latest
